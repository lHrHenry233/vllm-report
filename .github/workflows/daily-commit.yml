name: Daily Commit Fetch & Analyze

on:
  schedule:
    # 北京时间凌晨 2:00 = UTC 18:00 (前一日)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Compute date (CST, previous day)
        id: date
        env:
          TZ: Asia/Shanghai
        run: echo "date=$(date -d yesterday +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Fetch vllm commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_commits.py --repo vllm-project/vllm --branch main --api-only --date "${{ steps.date.outputs.date }}"

      - name: Analyze vllm commits (SIG classification)
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY not configured, skipping LLM analysis."
            echo "Pending dates can be analyzed locally via the Qoder vllm-sig-update skill."
          elif [ -f "data/vllm/commits/${{ steps.date.outputs.date }}.json" ]; then
            python scripts/analyze_commits.py \
              --repo vllm-project/vllm \
              --date "${{ steps.date.outputs.date }}" \
              --force
          else
            echo "No commit data for ${{ steps.date.outputs.date }}, skipping analysis"
          fi

      - name: Update date indexes
        run: python scripts/update_indexes.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || ( \
            git commit -m "chore: update data $(TZ=Asia/Shanghai date +%Y-%m-%d)" && \
            git push \
          )

      - name: Trigger Pages deployment
        if: ${{ ! cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run Deploy\ GitHub\ Pages
